  <path d="M10 54 V20 a10 10 0 0 1 10 -10 H680 a10 10 0 0 1 10 10 V54 Z" fill="#17131f"/>
  <rect x="10" y="54" width="680" height="2" fill="#ff6eb4" opacity="0.55"/>
