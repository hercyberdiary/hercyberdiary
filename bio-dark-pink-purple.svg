  <circle cx="58" cy="32" r="6" fill="#bf5fff"/>
  <circle cx="80" cy="32" r="6" fill="#5a4a7a"/>
  <text class="title" x="104" y="37">&gt;_ hercyberdiary.py</text>

  <!-- code -->
  <g class="mono" xml:space="preserve">
    <text x="40" y="100"><tspan class="k">import</tspan> cybersecurity</text>
    <text x="40" y="128"><tspan class="k">import</tspan> python</text>

    <text x="40" y="184">me.<tspan class="f">certs</tspan> = [<tspan class="s">"Security+ certified"</tspan>, <tspan class="s">"Network+ (in progress)"</tspan>]</text>
    <text x="40" y="212">me.<tspan class="f">goal</tspan> = <tspan class="s">"digital forensics"</tspan></text>

    <text x="40" y="268"><tspan class="k">while</tspan> goal.<tspan class="f">is_important</tspan>():</text>
    <text x="40" y="296">    me.<tspan class="f">learn</tspan>()</text>
    <text x="40" y="324">    me.<tspan class="f">build</tspan>()</text>
    <text x="40" y="352">    <tspan class="k">if</tspan> me.<tspan class="f">succeeds</tspan>():</text>
    <text x="40" y="380">        me.<tspan class="f">celebrate</tspan>()</text>
    <text x="40" y="408">    <tspan class="k">else</tspan>:</text>
    <text x="40" y="436">        me.<tspan class="f">get_better</tspan>()</text>
