<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-label="Python-style bio: import cybersecurity, import python, certs Security+ certified and Network+ in progress, goal digital forensics, a loop that learns and builds, celebrates on success, gets better otherwise" xmlns:c2pa="http://c2pa.org/manifest">
